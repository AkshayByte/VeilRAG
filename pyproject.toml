[build-system]
requires = ["setuptools>=68.0,<69"]
build-backend = "setuptools.build_meta"

[project]
name = "veilrag"
version = "0.1.0"
description = "Secure RAG agent with PII sanitization, local embeddings, and auditable data flow"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.5",
    "presidio-analyzer>=0.4",
    "presidio-anonymizer>=0.4",
    "spacy>=3.7",
    "langgraph>=0.2",
    "langchain>=0.1",
    "chromadb>=0.4",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "streamlit>=1.30",
    "sentence-transformers>=2.2",
    "torch>=2.1",
    "httpx>=0.26",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
veilrag = "src.rag.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
